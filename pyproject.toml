[project]
name = "sharp-obj"
version = "0.1.0"
description = "Real-time sharp object detection from the desktop camera using YOLO, with a Tk UI"
requires-python = ">=3.10,<3.13"
dependencies = [
    "ultralytics>=8.3.0",
    "opencv-python>=4.9",
    "pillow>=10.0",
    # Needed by YOLO-World to encode the custom text prompts
    "clip @ git+https://github.com/ultralytics/CLIP.git",
]

[tool.uv]
package = false
